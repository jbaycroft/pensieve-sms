<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0d1b0a">
  <meta name="description" content="The Burrow — household quest log at theburrow.house">
  <title>The Burrow</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323:wght@400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>window._cfUser = {{ cf_user | tojson }};</script>
  <script src="/static/htmx.min.js"></script>
  <style>
    /* ── Reset ── */
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Tokens ── */
    :root {
      --bg:          #0a1520;
      --wood-dark:   #1e1208;
      --wood-mid:    #2d1c0a;
      --wood-light:  #3d2810;
      --border:      #5c3d11;
      --border-mid:  #8b6020;
      --border-gold: #c49a2f;
      --parchment:   #f0ddb0;
      --parchment-dk:#cca870;
      --text-muted:  #c4a070;
      --text-dim:    #9a7a50;
      --green:       #7ec850;
      --green-mid:   #4a8a28;
      --green-dark:  #2d5516;
      --amber:       #e8b030;
      --red:         #c43828;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--parchment);
      min-height: 100dvh;
      overflow-x: hidden;
    }

    /* ── Sky + stars ── */
    .sky {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background:
        radial-gradient(ellipse at 20% 10%, rgba(30,60,20,0.25) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, rgba(20,30,60,0.2) 0%, transparent 50%),
        linear-gradient(180deg, #0a1520 0%, #0d1b0a 40%, #0a1208 100%);
    }
    .stars { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
    .star {
      position: absolute; background: #fff; border-radius: 50%;
      animation: twinkle var(--dur, 3s) ease-in-out infinite var(--delay, 0s);
    }
    @keyframes twinkle {
      0%,100% { opacity: var(--lo, 0.15); transform: scale(1); }
      50%     { opacity: var(--hi, 0.8);  transform: scale(1.2); }
    }

    /* ── Landscape ── */
    .landscape {
      position: fixed; bottom: 0; left: 0; right: 0;
      z-index: 0; pointer-events: none;
    }

    /* ── App shell ── */
    .app {
      position: relative; z-index: 1;
      max-width: 28rem;
      margin: 0 auto;
      padding: max(1rem, env(safe-area-inset-top)) 1rem 8rem;
    }

    /* ── Header ── */
    .header {
      text-align: center;
      padding: 0.5rem 0 1.25rem;
    }
    .header h1 {
      font-family: 'Press Start 2P', monospace;
      font-size: 0.8rem;
      color: var(--amber);
      text-shadow: 2px 2px 0 rgba(0,0,0,0.6);
      margin-bottom: 0.25rem;
      letter-spacing: 0.05em;
    }
    .header .greeting {
      font-family: 'VT323', monospace;
      font-size: 1.4rem;
      color: var(--text-muted);
    }

    /* ── Command bar (the main input) ── */
    .command-bar {
      background: var(--wood-mid);
      border: 3px solid var(--border);
      box-shadow:
        inset 2px 2px 0 var(--border-gold),
        inset -2px -2px 0 #3a2008,
        3px 3px 0 rgba(0,0,0,0.5),
        0 6px 20px rgba(0,0,0,0.4);
      border-radius: 6px;
      padding: 4px;
      display: flex;
      align-items: center;
      gap: 4px;
      position: relative;
    }
    .command-bar::before {
      content: ''; position: absolute; inset: 2px;
      border: 1px solid rgba(196,154,47,0.12);
      border-radius: 4px; pointer-events: none;
    }
    .command-input {
      flex: 1;
      background: var(--wood-dark);
      border: 2px solid transparent;
      border-radius: 4px;
      color: var(--parchment);
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      padding: 12px 14px;
      outline: none;
      min-height: 48px;
      transition: border-color 0.15s;
    }
    .command-input::placeholder { color: var(--text-dim); }
    .command-input:focus { border-color: rgba(74,138,40,0.4); }
    .command-submit {
      background: var(--green-dark);
      border: 2px solid var(--green-mid);
      box-shadow:
        inset 1px 1px 0 rgba(126,200,80,0.35),
        inset -1px -1px 0 #1a3a0a;
      color: var(--parchment);
      font-family: 'Inter', sans-serif;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      border-radius: 4px;
      padding: 0 18px;
      min-height: 48px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.12s;
      flex-shrink: 0;
    }
    .command-submit:hover { background: var(--green-mid); }
    .command-submit:active { transform: scale(0.97); }
    .command-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    .command-submit.is-loading {
      animation: btn-pulse 0.8s ease-in-out infinite;
    }
    @keyframes btn-pulse {
      0%,100% { border-color: var(--green-mid); }
      50%     { border-color: var(--green); box-shadow: 0 0 10px rgba(126,200,80,0.3); }
    }

    /* ── Quick action row ── */
    .actions {
      display: flex;
      justify-content: center;
      gap: 6px;
      padding: 1rem 0 0.25rem;
    }
    .action-icon {
      width: 46px;
      height: 46px;
      background: var(--wood-dark);
      border: 2px solid var(--border);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      cursor: pointer;
      transition: all 0.12s;
      box-shadow: 1px 2px 0 rgba(0,0,0,0.4);
      flex-shrink: 0;
    }
    .action-icon:hover {
      background: var(--wood-light);
      border-color: var(--border-mid);
      transform: translateY(-2px);
    }
    .action-icon:active { transform: translateY(1px); }
    .action-icon.active {
      background: var(--green-dark);
      border-color: var(--green-mid);
      box-shadow: 0 0 12px rgba(74,138,40,0.35), 1px 2px 0 rgba(0,0,0,0.4);
    }
    .action-label {
      display: none; /* labels only visible on wider screens */
    }
    @media (min-width: 400px) {
      .action-icon { width: 50px; height: 50px; font-size: 1.35rem; }
      .actions { gap: 8px; }
    }

    /* ── Expandable panel ── */
    .panel-slot {
      overflow: hidden;
      max-height: 0;
      opacity: 0;
      transition: max-height 0.3s ease-out, opacity 0.2s ease-out;
    }
    .panel-slot.is-open {
      max-height: 500px;
      opacity: 1;
    }
    .panel {
      background: var(--wood-mid);
      border: 3px solid var(--border);
      box-shadow:
        inset 2px 2px 0 var(--border-gold),
        inset -2px -2px 0 #3a2008,
        3px 3px 0 rgba(0,0,0,0.5);
      border-radius: 6px;
      padding: 1.25rem;
      margin-top: 0.75rem;
      position: relative;
    }
    .panel::before {
      content: ''; position: absolute; inset: 2px;
      border: 1px solid rgba(196,154,47,0.12);
      border-radius: 4px; pointer-events: none;
    }

    /* ── Panel form elements ── */
    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
    }
    .panel-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--amber);
    }
    .panel-close {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-dim);
      background: none;
      border: 1px solid transparent;
      border-radius: 3px;
      padding: 4px 10px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .panel-close:hover { color: var(--text-muted); border-color: var(--border); }
    .panel-label {
      font-size: 0.62rem;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-bottom: 0.4rem;
    }
    .panel-input {
      background: var(--wood-dark);
      border: 2px solid var(--border);
      box-shadow: inset 2px 2px 4px rgba(0,0,0,0.4);
      color: var(--parchment);
      border-radius: 3px;
      padding: 12px 14px;
      width: 100%;
      outline: none;
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      min-height: 48px;
      transition: border-color 0.15s;
    }
    .panel-input::placeholder { color: var(--text-dim); }
    .panel-input:focus { border-color: var(--green-mid); }

    /* ── Selector grid (coffee size, drink) ── */
    .sel-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.4rem;
    }
    .sel-btn {
      background: var(--wood-dark);
      border: 2px solid var(--border);
      box-shadow: inset 1px 1px 0 rgba(196,154,47,0.3), 1px 2px 0 rgba(0,0,0,0.4);
      color: var(--parchment-dk);
      font-family: 'Inter', sans-serif;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: capitalize;
      border-radius: 4px;
      padding: 10px 4px;
      cursor: pointer;
      transition: all 0.1s;
      text-align: center;
    }
    .sel-btn:hover { background: var(--wood-light); }
    .sel-btn:active { transform: translateY(1px); }
    .sel-btn.active {
      background: var(--green-dark);
      border-color: var(--green-mid);
      box-shadow: 0 0 10px rgba(74,138,40,0.3);
    }
    .sel-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }
    .sel-wrap .sel-btn {
      padding: 8px 12px;
      font-size: 0.75rem;
    }

    /* ── Panel submit ── */
    .panel-submit {
      background: var(--green-dark);
      border: 2px solid var(--green-mid);
      box-shadow: inset 1px 1px 0 rgba(126,200,80,0.3);
      color: var(--parchment);
      font-family: 'Inter', sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      border-radius: 4px;
      padding: 0 20px;
      min-height: 48px;
      width: 100%;
      cursor: pointer;
      transition: all 0.12s;
    }
    .panel-submit:hover { background: var(--green-mid); }
    .panel-submit:active { transform: scale(0.98); }
    .panel-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    .panel-submit.is-loading { animation: btn-pulse 0.8s ease-in-out infinite; }

    /* ── Checkbox ── */
    input[type="checkbox"] {
      accent-color: var(--green-mid);
      width: 16px; height: 16px; cursor: pointer;
    }

    /* ── Divider ── */
    .divider {
      border: none;
      border-top: 1px solid rgba(92,61,17,0.5);
      margin: 1.25rem 0 1rem;
    }

    /* ── Quest log ── */
    .log-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.6rem;
    }
    .log-title {
      font-size: 0.62rem;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }
    .log-refresh {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-dim);
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px 8px;
      transition: color 0.15s;
    }
    .log-refresh:hover { color: var(--text-muted); }

    /* ── Quest item ── */
    .quest {
      background: var(--wood-dark);
      border: 2px solid var(--border);
      border-left-width: 4px;
      border-radius: 4px;
      padding: 12px 14px;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: inset 1px 1px 0 rgba(196,154,47,0.1), 1px 2px 0 rgba(0,0,0,0.3);
      transition: background 0.15s, opacity 0.3s, transform 0.3s;
      animation: quest-in 0.2s ease-out both;
    }
    .quest:hover { background: #251408; }
    .quest.q-head   { border-left-color: var(--green-mid); }
    .quest.q-urgent { border-left-color: var(--red); }
    .quest.q-high   { border-left-color: var(--amber); }
    .quest.q-normal { border-left-color: var(--border); }
    .quest.is-done {
      opacity: 0; transform: translateX(20px);
    }
    @keyframes quest-in {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .quest:nth-child(1) { animation-delay: 0ms; }
    .quest:nth-child(2) { animation-delay: 30ms; }
    .quest:nth-child(3) { animation-delay: 60ms; }
    .quest:nth-child(4) { animation-delay: 90ms; }
    .quest:nth-child(5) { animation-delay: 120ms; }
    .quest:nth-child(n+6){ animation-delay: 150ms; }

    .quest-rank {
      font-family: 'VT323', monospace;
      font-size: 1.3rem;
      width: 22px;
      text-align: center;
      flex-shrink: 0;
    }
    .quest-body { flex: 1; min-width: 0; }
    .quest-title {
      font-size: 0.85rem;
      font-weight: 500;
      line-height: 1.35;
      color: var(--parchment);
      margin-bottom: 2px;
    }
    .quest-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .quest-badge {
      font-size: 0.65rem;
      font-weight: 600;
      color: var(--text-dim);
      background: rgba(196,154,47,0.08);
      border: 1px solid rgba(196,154,47,0.15);
      padding: 1px 6px;
      border-radius: 2px;
    }
    .quest-time {
      font-family: 'VT323', monospace;
      font-size: 1rem;
      color: var(--text-dim);
    }
    .quest-head-tag {
      font-size: 0.6rem;
      font-weight: 700;
      background: rgba(126,200,80,0.1);
      border: 1px solid rgba(126,200,80,0.3);
      color: var(--green);
      padding: 1px 7px;
      border-radius: 2px;
      white-space: nowrap;
    }
    .quest-done {
      width: 34px;
      height: 34px;
      border: 2px solid var(--border);
      border-radius: 4px;
      background: transparent;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      padding: 0;
    }
    .quest-done svg { transition: stroke 0.15s; }
    .quest-done:hover {
      border-color: var(--green-mid);
      background: rgba(126,200,80,0.08);
    }
    .quest-done:hover svg { stroke: var(--green); }
    .quest-done:active {
      background: var(--green-dark);
      border-color: var(--green);
      transform: scale(0.9);
    }

    /* ── Empty state ── */
    .empty-state {
      text-align: center;
      padding: 2.5rem 1rem;
    }
    .empty-icon { font-size: 2.5rem; margin-bottom: 0.75rem; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); }
    .empty-text { font-size: 0.85rem; color: var(--text-dim); }
    .empty-sub { font-family: 'VT323', monospace; font-size: 1.2rem; color: var(--text-dim); margin-top: 0.25rem; }

    /* ── Skeleton ── */
    .skel {
      background: linear-gradient(90deg, var(--wood-dark) 25%, #261810 50%, var(--wood-dark) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 2px;
    }
    @keyframes shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* ── Toast ── */
    .toast {
      position: fixed;
      left: 1rem; right: 1rem;
      bottom: max(1.5rem, calc(env(safe-area-inset-bottom) + 1rem));
      max-width: 22rem;
      margin: 0 auto;
      z-index: 9999;
      background: var(--wood-mid);
      border: 3px solid var(--border);
      box-shadow:
        inset 2px 2px 0 rgba(196,154,47,0.35),
        inset -2px -2px 0 #2a1406,
        3px 4px 0 rgba(0,0,0,0.6);
      border-radius: 6px;
      padding: 14px 18px;
      display: none;
      transform: translateY(1rem);
      opacity: 0;
      transition: opacity 0.25s, transform 0.25s;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast-inner {
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }
    .toast-icon {
      font-size: 1rem;
      flex-shrink: 0;
      margin-top: 1px;
    }
    .toast-msg {
      font-family: 'VT323', monospace;
      font-size: 1.2rem;
      line-height: 1.35;
      color: var(--parchment);
    }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 0; }

    /* ── Reduced motion ── */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

      <rect x="1136" y="96" width="48" height="8"/>
    </g>
  </svg>
</div>

{% block content %}{% endblock %}

<!-- Toast -->
<div id="toast" class="toast" role="status" aria-live="polite">
  <div class="toast-inner">
    <span class="toast-icon">&#10022;</span>
    <span id="toast-msg" class="toast-msg"></span>
  </div>
</div>

<script>
// Stars
(function() {
  var c = document.getElementById('stars');
  for (var i = 0; i < 80; i++) {
    var s = document.createElement('div');
    s.className = 'star';
    var sz = Math.random() * 2 + 0.5;
    s.style.cssText =
      'width:'+sz+'px;height:'+sz+'px;'+
      'top:'+(Math.random()*60).toFixed(1)+'%;'+
      'left:'+(Math.random()*100).toFixed(1)+'%;'+
      '--dur:'+(Math.random()*4+2).toFixed(1)+'s;'+
      '--delay:-'+(Math.random()*4).toFixed(1)+'s;'+
      '--lo:'+(Math.random()*0.15+0.05).toFixed(2)+';'+
      '--hi:'+(Math.random()*0.4+0.4).toFixed(2);
    c.appendChild(s);
  }
})();

// App
var Burrow = (function() {
  var user = window._cfUser || 'John';
  var priority = 'normal';
  var openPanel = null;
  var toastTimer = null;
  var locks = {};

  function lock(n) { if (locks[n]) return false; locks[n] = true; setTimeout(function(){ locks[n] = false; }, 8000); return true; }
  function unlock(n) { locks[n] = false; }

  function toast(msg) {
    var el = document.getElementById('toast');
    var tx = document.getElementById('toast-msg');
    if (!el || !tx) return;
    tx.textContent = msg;
    el.style.display = 'block';
    el.offsetHeight;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function() {
      el.classList.remove('show');
      setTimeout(function() { el.style.display = 'none'; }, 300);
    }, 4000);
  }

  function api(url, opts) {
    opts.credentials = 'same-origin';
    return fetch(url, opts).then(function(r) {
      var ct = r.headers.get('content-type') || '';
      if (ct.indexOf('application/json') === -1) throw new Error('Auth expired — reload page');
      return r.json();
    });
  }

  function setLoading(btn, on) {
    if (!btn) return;
    if (on) {
      btn.dataset.orig = btn.textContent;
      btn.textContent = 'Sending\u2026';
      btn.disabled = true;
      btn.classList.add('is-loading');
    } else {
      btn.textContent = btn.dataset.orig || 'Queue it';
      btn.disabled = false;
      btn.classList.remove('is-loading');
    }
  }

  function togglePanel(id) {
    if (openPanel) {
      var ow = document.getElementById('slot-' + openPanel);
      var ob = document.getElementById('act-' + openPanel);
      if (ow) ow.classList.remove('is-open');
      if (ob) ob.classList.remove('active');
    }
    if (openPanel === id) { openPanel = null; return; }
    openPanel = id;
    var w = document.getElementById('slot-' + id);
    var b = document.getElementById('act-' + id);
    if (w) { w.offsetHeight; w.classList.add('is-open'); }
    if (b) b.classList.add('active');
    htmx.ajax('GET', '/api/action-panel/' + id + '?user=' + encodeURIComponent(user),
      { target: '#panel-' + id, swap: 'innerHTML' });
  }

  function closePanel() {
    if (!openPanel) return;
    var w = document.getElementById('slot-' + openPanel);
    var b = document.getElementById('act-' + openPanel);
    if (w) w.classList.remove('is-open');
    if (b) b.classList.remove('active');
    openPanel = null;
  }

  function panelSelect(el, hiddenId, val) {
    var h = document.getElementById(hiddenId);
    if (h) h.value = val;
    var sibs = el.parentElement.querySelectorAll('button');
    for (var i = 0; i < sibs.length; i++) sibs[i].classList.remove('active');
    el.classList.add('active');
  }

  function fireCoffee() {
    fireAction('coffee', {
      type: (document.getElementById('coffee-type') || {}).value || 'hot',
      quality: (document.getElementById('coffee-quality') || {}).value || 'cheap',
      drink: (document.getElementById('coffee-drink') || {}).value || 'drip',
      notes: (document.getElementById('coffee-notes') || {}).value || '',
      remember: (document.getElementById('coffee-remember') || {}).checked
    });
  }

  function submitTask() {
    var inp = document.getElementById('cmd-input');
    var btn = document.getElementById('cmd-submit');
    var body = (inp ? inp.value : '').trim();
    if (!body) { toast('Type something first'); return; }
    if (!lock('submit')) return;
    setLoading(btn, true);

    var prefix = priority === 'urgent' ? '!! ' : priority === 'high' ? '! ' : '';
    api('/api/task', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ body: prefix + body, user: user })
    })
    .then(function(d) {
      if (d.ticket_id) {
        toast('\u2605 ' + d.enhanced);
        inp.value = '';
        priority = 'normal';
        htmx.trigger('#quest-log', 'refresh');
      } else toast('\u2717 ' + (d.error || 'Something went wrong'));
    })
    .catch(function(e) { toast('\u2717 ' + e.message); })
    .finally(function() { unlock('submit'); setLoading(btn, false); });
  }

  function fireAction(actionId, payload) {
    if (!lock('action')) return;
    var panel = document.getElementById('panel-' + actionId);
    var btn = panel ? panel.querySelector('.panel-submit') : null;
    setLoading(btn, true);

    var p = {};
    for (var k in payload) p[k] = payload[k];
    p.action_id = actionId;
    p.user = user;
    p.priority = priority;

    api('/api/quick-action', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(p)
    })
    .then(function(d) {
      if (d.ticket_id) {
        toast('\u2605 ' + d.enhanced);
        closePanel();
        priority = 'normal';
        htmx.trigger('#quest-log', 'refresh');
      } else toast('\u2717 ' + (d.error || 'Something went wrong'));
    })
    .catch(function(e) { toast('\u2717 ' + e.message); })
    .finally(function() { unlock('action'); setLoading(btn, false); });
  }

  function completeTask(tid) {
    if (!lock('done-' + tid)) return;
    var btn = document.querySelector('[data-tid="' + tid + '"]');
    var item = btn ? btn.closest('.quest') : null;
    if (item) item.classList.add('is-done');

    api('/api/task/' + tid + '/done', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' }
    })
    .then(function(d) {
      if (d.ok) {
        toast('\u2714 Quest complete!');
        setTimeout(function() { htmx.trigger('#quest-log', 'refresh'); }, 300);
      } else {
        toast('\u2717 ' + (d.error || 'Something went wrong'));
        if (item) item.classList.remove('is-done');
      }
    })
    .catch(function(e) { toast('\u2717 ' + e.message); if (item) item.classList.remove('is-done'); })
    .finally(function() { unlock('done-' + tid); });
  }

  return {
    toast: toast,
    togglePanel: togglePanel,
    closePanel: closePanel,
    panelSelect: panelSelect,
    fireCoffee: fireCoffee,
    submitTask: submitTask,
    fireAction: fireAction,
    completeTask: completeTask
  };
})();

// Greeting
(function() {
  var el = document.getElementById('greeting');
  if (!el) return;
  var h = new Date().getHours();
  var t = h < 12 ? 'Morning' : h < 17 ? 'Afternoon' : 'Evening';
  var u = window._cfUser || '';
  el.textContent = u === 'Jeannie' ? 'Hey Jeannie!' : t + ', ' + (u || 'traveler') + '.';
})();

if ('serviceWorker' in navigator) {
  var _sw = false;
  navigator.serviceWorker.addEventListener('controllerchange', function() { if (!_sw) { _sw = true; location.reload(); } });
  navigator.serviceWorker.register('/sw.js').catch(function(){});
}
</script>
</body>
</html>
