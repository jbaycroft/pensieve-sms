{% extends "base.html" %}
{% block content %}
<div class="app">

  <!-- Header -->
  <div class="header">
    <h1>&#8962; The Burrow</h1>
    <div id="greeting" class="greeting">&#10022; Welcome.</div>
  </div>

  <!-- Command bar -->
  <div class="command-bar">
    <input type="text"
      id="cmd-input"
      class="command-input"
      placeholder="What needs doing?"
      onkeydown="if(event.key==='Enter')Burrow.submitTask()"
      autocomplete="off"
      inputmode="text"
      aria-label="Task description">
    <button id="cmd-submit"
      class="command-submit"
      onclick="Burrow.submitTask()">Queue it</button>
  </div>

  <!-- Quick actions -->
  <div class="actions">
    {% for action in actions %}
    <button
      id="act-{{ action.id }}"
      class="action-icon"
      onclick="Burrow.togglePanel('{{ action.id }}')"
      title="{{ action.label }}"
      aria-label="{{ action.label }}">
      {{ action.icon }}
    </button>
    {% endfor %}
  </div>

  <!-- Timeline selector (applies to all submissions) -->
  <div class="horizon-label">&#9200; when</div>
  <div class="horizon-row">
    <button class="horizon-btn" data-hz="day" onclick="Burrow.setHorizon('day',this)">day</button>
    <button class="horizon-btn" data-hz="week" onclick="Burrow.setHorizon('week',this)">week</button>
    <button class="horizon-btn" data-hz="2weeks" onclick="Burrow.setHorizon('2weeks',this)">2wk</button>
    <button class="horizon-btn active" data-hz="month" onclick="Burrow.setHorizon('month',this)">month</button>
    <button class="horizon-btn" data-hz="quarter" onclick="Burrow.setHorizon('quarter',this)">qtr</button>
    <button class="horizon-btn" data-hz="year" onclick="Burrow.setHorizon('year',this)">year</button>
  </div>

  <!-- Expandable action panels -->
  {% for action in actions %}
  <div id="slot-{{ action.id }}" class="panel-slot">
    <div id="panel-{{ action.id }}" class="panel">
      <div style="text-align:center; padding:1rem 0; color:var(--text-dim); font-family:'VT323',monospace; font-size:1.2rem">Loading&#8230;</div>
    </div>
  </div>
  {% endfor %}

  <hr class="divider">

  <!-- Quest log -->
  <div class="log-header">
    <div class="log-title">&#128220; Quest Log</div>
    <button
      hx-get="/api/queue"
      hx-target="#quest-log"
      hx-swap="innerHTML"
      class="log-refresh">&#8635; refresh</button>
  </div>

  <div id="quest-log"
       hx-get="/api/queue"
       hx-trigger="load, refresh"
       hx-swap="innerHTML">
    <!-- Skeleton -->
    <div class="quest q-normal" style="animation:none">
      <div class="skel" style="width:22px;height:22px;flex-shrink:0"></div>
      <div class="quest-body">
        <div class="skel" style="height:14px;width:65%;margin-bottom:6px"></div>
        <div class="skel" style="height:10px;width:30%"></div>
      </div>
    </div>
    <div class="quest q-normal" style="animation:none">
      <div class="skel" style="width:22px;height:22px;flex-shrink:0"></div>
      <div class="quest-body">
        <div class="skel" style="height:14px;width:80%;margin-bottom:6px"></div>
        <div class="skel" style="height:10px;width:25%"></div>
      </div>
    </div>
  </div>

</div>
{% endblock %}
