{% extends "base.html" %}
{% block content %}

  <!-- ══════════════════════════════════════════════════════════ -->
  <!-- MAIN APP — user is auto-detected from Google auth         -->
  <!-- ══════════════════════════════════════════════════════════ -->
  <div class="max-w-lg mx-auto px-4 pb-32"
       style="padding-top: max(1.5rem, env(safe-area-inset-top))">

    <!-- ── Header ── -->
    <div class="flex items-start justify-between mb-6">
      <div>
        <h1 class="pixel-font mb-2"
            style="font-size:0.875rem; color:var(--amber); text-shadow:2px 2px 0 rgba(0,0,0,0.6); line-height:1.6">
          &#8962; The Burrow
        </h1>
        <p class="vt-font text-2xl" style="color:var(--text-muted)">
          <span x-text="user === 'John' ? '&#10022; Morning, John.' : '&#10022; Hey Jeannie!'"></span>
        </p>
      </div>
    </div>

    <!-- ── Quick Actions grid ── -->
    <div class="mb-2">
      <div class="section-label mb-3">&#9889; Quick Actions</div>
      <div class="grid grid-cols-3 gap-3">
        {% for action in actions %}
        <button
          @click="
            openPanel = (openPanel === '{{ action.id }}') ? null : '{{ action.id }}';
            if (openPanel === '{{ action.id }}') loadPanel('{{ action.id }}');
          "
          :class="openPanel === '{{ action.id }}' ? 'action-btn active' : 'action-btn'"
          class="p-3 text-center flex flex-col items-center justify-center gap-2"
          aria-label="{{ action.label }}">
          <div class="text-3xl leading-none">{{ action.icon }}</div>
          <div class="text-action-label">{{ action.label }}</div>
        </button>
        {% endfor %}
      </div>
    </div>

    <!-- ── Action panels (HTMX loaded on demand) ── -->
    {% for action in actions %}
    <div
      x-show="openPanel === '{{ action.id }}'"
      x-transition:enter="transition ease-out duration-150"
      x-transition:enter-start="opacity-0 -translate-y-1"
      x-transition:enter-end="opacity-100 translate-y-0"
      x-transition:leave="transition ease-in duration-100"
      x-transition:leave-start="opacity-100"
      x-transition:leave-end="opacity-0"
      x-cloak
      @close-panel.stop="openPanel = null"
      @fire-action.stop="fireAction($event.detail.actionId, $event.detail.payload)"
      class="mt-3 mb-2">
      <div id="panel-{{ action.id }}" class="pixel-panel p-5">
        <div class="vt-font text-xl text-center" style="color:var(--text-dim)">Loading&#8230;</div>
      </div>
    </div>
    {% endfor %}

    <!-- ── Priority selector ── -->
    <div class="mt-5 mb-3">
      <div class="section-label mb-3">&#9888; Priority</div>
      <div class="grid grid-cols-3 gap-2">
        <button @click="priority = 'normal'"
          :class="priority === 'normal' ? 'priority-pill p-normal' : 'priority-pill'">
          <span>&#9898;</span><span>Normal</span>
        </button>
        <button @click="priority = 'high'"
          :class="priority === 'high' ? 'priority-pill p-high' : 'priority-pill'">
          <span>&#9733;</span><span>High</span>
        </button>
        <button @click="priority = 'urgent'"
          :class="priority === 'urgent' ? 'priority-pill p-urgent' : 'priority-pill'">
          <span>&#8252;</span><span>Urgent</span>
        </button>
      </div>
    </div>

    <!-- ── Free-form task entry ── -->
    <div class="pixel-panel p-4 mb-6">
      <div class="section-label mb-3">&#9998; Add Task</div>
      <input type="text"
        x-model="taskBody"
        @keydown.enter="submitTask()"
        placeholder="What needs doing?"
        autocomplete="off"
        inputmode="text"
        aria-label="Task description"
        class="burrow-input mb-3">
      <div class="flex gap-2">
        <select x-model="taskDomain" class="burrow-select flex-1" aria-label="Task domain">
          <option value="">Domain: auto</option>
          <option value="w">Work</option>
          <option value="h">Hydroponics</option>
          <option value="p">Property</option>
          <option value="f">Physical</option>
          <option value="ho">Hobby</option>
          <option value="c">Connection</option>
        </select>
        <button @click="submitTask()" class="btn-primary" :disabled="submitting"
          x-text="submitting ? 'Sending…' : 'Queue it'"></button>
      </div>
    </div>

    <!-- ── Quest Log ── -->
    <div class="flex items-center justify-between mb-3">
      <div class="section-label">&#128220; Quest Log</div>
      <button
        hx-get="/api/queue"
        hx-target="#queue-list"
        hx-swap="innerHTML"
        class="btn-ghost">&#8635; refresh</button>
    </div>

    <div id="queue-list"
         hx-get="/api/queue"
         hx-trigger="load, refresh"
         hx-swap="innerHTML">
      <!-- Skeleton while loading -->
      <div class="space-y-2">
        <div class="quest-item p-normal flex gap-3 px-4 py-4">
          <div class="skeleton w-5 h-5 shrink-0 mt-1 rounded"></div>
          <div class="flex-1 space-y-2">
            <div class="skeleton h-4 rounded" style="width:65%"></div>
            <div class="skeleton h-3 rounded" style="width:35%"></div>
          </div>
        </div>
        <div class="quest-item p-normal flex gap-3 px-4 py-4">
          <div class="skeleton w-5 h-5 shrink-0 mt-1 rounded"></div>
          <div class="flex-1 space-y-2">
            <div class="skeleton h-4 rounded" style="width:80%"></div>
            <div class="skeleton h-3 rounded" style="width:25%"></div>
          </div>
        </div>
        <div class="quest-item p-normal flex gap-3 px-4 py-4">
          <div class="skeleton w-5 h-5 shrink-0 mt-1 rounded"></div>
          <div class="flex-1 space-y-2">
            <div class="skeleton h-4 rounded" style="width:50%"></div>
            <div class="skeleton h-3 rounded" style="width:40%"></div>
          </div>
        </div>
      </div>
    </div>

  </div><!-- /main app -->
{% endblock %}
